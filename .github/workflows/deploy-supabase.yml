# Deploys the hosted Supabase project whenever backend/supabase changes on
# main: applies pending migrations, then redeploys every edge function that
# has an index.ts (placeholder folders with only .gitkeep are skipped).
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN — personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD  — the project's database password
#
# Function secrets (CLERK_SECRET_KEY, R2_*, …) live in the Supabase project
# and aren't touched here.

name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - 'backend/supabase/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

# Never run two deploys at once; queue instead of cancelling a half-applied one.
concurrency:
  group: deploy-supabase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: eigyrdscekxoetqbidrr
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply migrations
        run: supabase db push

      # Functions import shared/ through this symlink (see backend/CLAUDE.md):
      # `deploy --use-api` uploads files under their path relative to
      # backend/ and refuses `..`, so ../shared can't be uploaded directly.
      - name: Check the shared/ symlink
        run: |
          link=supabase/functions/_shared/myrating-shared
          if [ ! -L "$link" ] || [ "$(cd "$link" && pwd -P)" != "$(cd ../shared/src && pwd -P)" ]; then
            echo "::error::$link must be a symlink to shared/src"
            exit 1
          fi

      # One bad function must not block the others: deploy them all, then
      # fail the job listing every function that didn't deploy.
      - name: Deploy edge functions
        run: |
          failed=""
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            if [ -f "$dir/index.ts" ]; then
              echo "Deploying $name"
              if ! supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_REF" --use-api; then
                echo "::error::Deploying $name failed"
                failed="$failed $name"
              fi
            else
              echo "Skipping $name (no index.ts)"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::Functions that failed to deploy:$failed"
            exit 1
          fi
